<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" width="1600" height="760" fill="none">
  <title>Delhi NCR at blue hour</title>
  <desc>A silver metro train rides above rooftops and trees as the evening sun drops through a band of haze.</desc>
  <style>
    #sky:target ~ .city-layer, #sky:target ~ .near-scene,
    #city:target ~ .sky-layer, #city:target ~ .near-scene,
    #skyline:target ~ .near-scene, #metro:target ~ .distant-scene { display: none; }
  </style>
